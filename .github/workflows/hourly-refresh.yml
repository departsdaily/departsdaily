name: Board refresh

# MEASURED Jul 28 2026: the old hourly cron ("7 * * * *") delivered 36 runs in
# a 56 hour window, with gaps up to 11.4 hours. Two reasons:
#   1. GitHub delays or DROPS scheduled runs under load, and the worst slot is
#      the top of the hour. Minute :07 sat right in it. Now :23.
#   2. Hourly across 10 origins was also ~7,200 Travelpayouts calls a day for
#      a board almost nobody reads at 4am.
# So: every 2 hours through waking hours, nothing overnight. 9 runs a day,
# roughly 2,700 calls, and a single dropped run now costs 2 hours instead of 6.
# Times are UTC and shift by an hour at DST. In November move these to
# 1,3,11,13,15,17,19,21,23 to keep the same local hours.
#   10:23 UTC = 6:23am ET  ...  02:23 UTC = 10:23pm ET
on:
  schedule:
    - cron: "23 0,2,10,12,14,16,18,20,22 * * *"
  workflow_dispatch:        # allows manual "Run workflow" button too
  push:                     # any site/script change pushed to main auto-deploys
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/hourly-refresh.yml"]

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull live fares and rewrite board data
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python scripts/update_deals.py site/js/deals-data.js

      - name: Commit refreshed board
        run: |
          git config user.name "departs-daily-bot"
          git config user.email "board@departsdaily.com"
          git add site/js/deals-data.js state/
          git commit -m "Board refresh $(date -u '+%F %H:%M UTC')" || {
            echo "No changes to commit"; exit 0; }
          # Retry the rebase-and-push: the fares are already fetched by this
          # point, so losing the race to a concurrent commit must not throw
          # the refresh away. A single rebase is not enough because another
          # push can land between the rebase and the push.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort || true; }
            if git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected, retrying ($attempt)"; sleep 6
          done
          echo "could not push after 5 attempts"; exit 1

      # Hosting is Cloudflare Pages: it builds automatically on push to main.
