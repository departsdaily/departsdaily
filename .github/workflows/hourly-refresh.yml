name: Hourly board refresh

on:
  schedule:
    - cron: "7 */4 * * *"   # every 4 hours - was hourly.
    # Netlify bills 15 credits per production deploy; 24 deploys/day was
    # 360 credits/day against a 300/month allowance. Fares this far out do
    # not move hour to hour, so nothing on the board is less accurate.
    # Revert to "0 * * * *" once hosting no longer charges per deploy.
  workflow_dispatch:        # allows manual "Run workflow" button too
  push:                     # any site/script change pushed to main auto-deploys
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/hourly-refresh.yml"]

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull live fares and rewrite board data
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python scripts/update_deals.py site/js/deals-data.js

      - name: Commit refreshed board
        run: |
          git config user.name "departs-daily-bot"
          git config user.email "board@departsdaily.com"
          git add site/js/deals-data.js state/
          git commit -m "Board refresh $(date -u '+%F %H:%M UTC')" || echo "No changes to commit"
          # Rebase before pushing: any concurrent commit to main (a manual
          # push, or another workflow) otherwise rejects this as non-fast-
          # forward and the whole refresh fails after the fares were fetched.
          git pull --rebase origin main || git rebase --abort || true
          git push origin HEAD:main

      # Still hosted on Netlify. When the Cloudflare Pages migration happens
      # (see GO-LIVE.md Part 1), delete this step — Cloudflare builds on push.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          cd site && zip -rq ../deploy.zip . && cd ..
          curl -sf -X POST "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@deploy.zip" -o deploy_result.json
          python3 -c "import json; d=json.load(open('deploy_result.json')); print('Netlify deploy:', d.get('state'), d.get('id'))"
