name: Board refresh

# THE SCHEDULE DOES NOT LIVE HERE ANY MORE. It lives in worker/wrangler.toml.
#
# WHY. GitHub's cron is best effort and openly drops runs. Measured Jul 28
# 2026: 36 of 56 hourly slots actually delivered, with gaps up to 11.4 hours.
# Retiming it to every 2 hours on Jul 29 made it worse, not better — GitHub
# delivered ZERO of the next two slots and the board sat at the previous
# evening's stamp until an unrelated push happened to shake it loose.
#
# So the heartbeat is now a Cloudflare cron trigger on the departsdaily-fares
# Worker, firing every 2 hours at :13 around the clock and POSTing
# repository_dispatch (event_type: board-refresh) to start this workflow.
# Cloudflare fires on time. A plain 2 hour interval also means DST never
# needs a code change and there is no overnight hole.
#
# The cron below is a BACKUP for the case where Cloudflare or the dispatch
# token is down. It runs on the odd hours at :43, an hour off the Worker, and
# the freshness gate makes it a no-op whenever the board is already current —
# so it costs nothing while the primary path works.
on:
  repository_dispatch:
    types: [board-refresh]   # <- the Cloudflare Worker cron. PRIMARY.
  schedule:
    - cron: "43 1-23/2 * * *"   # backup only; skipped if the board is fresh
  workflow_dispatch:        # allows manual "Run workflow" button too
  push:                     # any site/script change pushed to main auto-deploys
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/hourly-refresh.yml"]

# Two triggers landing together must not race each other's push.
concurrency:
  group: board-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freshness gate (backup cron only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import re, datetime, sys
          src = open("site/js/deals-data.js").read()
          m = re.search(r'updated:"([^"]+)"', src)
          if not m:
              print("run=yes"); sys.exit(0)
          age = (datetime.datetime.now(datetime.timezone.utc)
                 - datetime.datetime.fromisoformat(m.group(1))).total_seconds() / 60
          print(f"run={'yes' if age > 100 else 'no'}")
          print(f"age={age:.0f}", file=sys.stderr)
          EOF
      - name: Note when the backup stands down
        if: steps.gate.outputs.run != 'yes'
        run: echo "Board is under 100 minutes old - the Worker cron is doing its job. Nothing to do." >> $GITHUB_STEP_SUMMARY

      - name: Pull live fares and rewrite board data
        if: steps.gate.outputs.run == 'yes'
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python scripts/update_deals.py site/js/deals-data.js

      - name: Commit refreshed board
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "departs-daily-bot"
          git config user.email "board@departsdaily.com"
          git add site/js/deals-data.js state/
          git commit -m "Board refresh $(date -u '+%F %H:%M UTC')" || {
            echo "No changes to commit"; exit 0; }
          # Retry the rebase-and-push: the fares are already fetched by this
          # point, so losing the race to a concurrent commit must not throw
          # the refresh away. A single rebase is not enough because another
          # push can land between the rebase and the push.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort || true; }
            if git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected, retrying ($attempt)"; sleep 6
          done
          echo "could not push after 5 attempts"; exit 1

      # Hosting is Cloudflare Pages: it builds automatically on push to main.
