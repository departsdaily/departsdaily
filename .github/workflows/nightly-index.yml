name: Nightly fare index

# Rebuilds the Fare Finder index for every pre-built origin.
# Runs at 03:10 ET. Fares this far out do not move hour to hour, so nightly
# is plenty — and it keeps us far inside every rate limit and free tier.
on:
  schedule:
    - cron: "10 7 * * *"      # 03:10 EDT / 02:10 EST
  workflow_dispatch:
    inputs:
      origins:
        description: "Comma-separated origins (blank = default 10)"
        required: false
      months:
        description: "Months ahead to index (default 6)"
        required: false

concurrency:
  group: fare-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build per-origin indexes
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          ORIGINS: ${{ github.event.inputs.origins }}
          INDEX_MONTHS: ${{ github.event.inputs.months || '6' }}
          TP_SLEEP: "0.4"
        run: |
          mkdir -p site/data
          python scripts/build_index.py site/data
          echo "--- built ---"
          ls -lh site/data/

      # Index files are regenerated data, not source. They go to a dedicated
      # orphan branch that is force-pushed, so main's history never grows by
      # ~2MB a night. Cloudflare Pages builds from main and pulls these in.
      - name: Publish index to data branch
        run: |
          git config user.name  "departsdaily-bot"
          git config user.email "bot@departsdaily.com"
          git checkout --orphan data-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name site -exec rm -rf {} + || true
          mkdir -p _data && cp site/data/*.json _data/ && rm -rf site
          git add _data
          git commit -q -m "fare index $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin data-tmp:data
          echo "pushed to data branch"

      - name: Summary
        if: always()
        run: |
          echo "### Fare index" >> $GITHUB_STEP_SUMMARY
          cat site/data/manifest.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "no manifest" >> $GITHUB_STEP_SUMMARY
