name: Morning Instagram post

# Fired four ways:
#   1. repository_dispatch "ig-post" from the Cloudflare Worker cron — PRIMARY,
#      6:52 AM ET, the only one that has ever been reliable,
#   2. a push to the 'ig-trigger' branch (the old precise-timing path),
#   3. the daily GitHub cron below (backup; has never actually fired),
#   4. manually from the Actions tab.
#
# MANUAL RUNS TAKE A `dry_run` INPUT. It fetches real fares, renders the real
# slides, uploads them as an artifact and stops — nothing published, nothing
# committed, no history written. Use it to see what tomorrow's post will look
# like before tomorrow, which is the only way to test a pipeline change against
# live Travelpayouts data without posting twice in a day.
#
# The cron used to be left out on purpose, because GitHub cron can run hours
# late and a second same-day firing would double-post. That objection is gone:
# the plan job now drops any origin that already has a state/history entry
# dated today, so an extra firing is a no-op rather than a duplicate post.
# The trigger push can therefore fail (proxy block, dead scheduler, whatever)
# and the post still goes out on its own.
#
# Two cron lines, not one, so DST never needs a hand edit: 10:45 UTC is
# 6:45 AM ET while EDT is in effect, 11:45 UTC is 6:45 AM ET while EST is.
# The one that is out of season fires an hour off and, after a good run, does
# nothing — which also makes it a free retry when the earlier run failed.
#
# NOTE (2026-08-13): the cron below is now the BACKUP, not the trigger. It has
# never once fired. The real trigger is the repository_dispatch above.
#
# One job per origin whose config/origins.json block has ig_enabled: true.
# An origin with no Instagram token yet stays false and is simply not in the
# matrix — it costs nothing and cannot fail the run.
on:
  # PRIMARY as of 2026-08-13. The Cloudflare Worker cron fires this at 10:52 /
  # 11:52 UTC. GitHub's own scheduler is not trustworthy on this repo: the
  # `schedule:` block below was added 2026-08-12 and delivered ZERO runs, so
  # 2026-08-13's post simply never went out. Same measured failure that already
  # moved the board refresh onto the Worker (see worker/wrangler.toml).
  repository_dispatch:
    types: [ig-post]
  push:
    branches: [ig-trigger]
  schedule:
    - cron: "45 10 * * *"   # 6:45 AM ET during EDT (7:45 AM ET during EST)
    - cron: "45 11 * * *"   # 6:45 AM ET during EST (5:45 AM ET during EDT)
  workflow_dispatch:
    inputs:
      origins:
        description: "Comma-separated origins to post (blank = every ig_enabled origin)"
        required: false
      force:
        description: "Post even if this origin already posted today"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "REHEARSAL. Fetch fares and render the slides, upload them as an artifact, and stop. Nothing is posted, nothing is committed, no history is written."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ig-post
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      origins: ${{ steps.pick.outputs.origins }}
      count: ${{ steps.pick.outputs.count }}
      skipped: ${{ steps.pick.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide which origins post today
        id: pick
        env:
          REQUESTED: ${{ github.event.inputs.origins }}
          # A rehearsal has to reach the post job even on a day that already
          # posted, otherwise there is nothing to rehearse. It cannot
          # double-post: every step from staging onwards is skipped.
          FORCE: ${{ (github.event.inputs.force == 'true' || github.event.inputs.dry_run == 'true') && 'true' || 'false' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os

          cfg = json.load(open("config/origins.json"))
          req = [o.strip().upper() for o in os.environ.get("REQUESTED", "").split(",") if o.strip()]
          force = os.environ.get("FORCE", "").lower() == "true"

          # The runner is UTC and pipeline/fetch_fares.py stamps history with the
          # runner's own date, so comparing against the UTC date is comparing like
          # with like. At the 10:45/11:45 UTC fire times the UTC date and the ET
          # date are the same day anyway.
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()

          def posted_today(code):
              # CLT keeps the original unprefixed filename; every other origin is
              # history-<CODE>.json. A missing or unreadable file means we have no
              # evidence of a post, so the origin stays in the matrix.
              path = "state/history.json" if code == "CLT" else "state/history-%s.json" % code
              try:
                  with open(path) as fh:
                      hist = json.load(fh)
              except (OSError, ValueError):
                  return False
              if not isinstance(hist, dict):
                  return False
              return any(v == today for v in hist.values())

          picked, skipped = [], []
          for code, o in cfg.items():
              if code.startswith("_"):
                  continue
              if req and code not in req:
                  continue
              if not req and not o.get("ig_enabled"):
                  continue
              # History is committed only AFTER a publish succeeds ("Record what
              # was posted"), so an entry dated today means today's post really
              # went out — the one safe signal that a second firing would be a
              # duplicate. Manual dispatch with force: true overrides it.
              if not force and posted_today(code):
                  skipped.append(code)
                  continue
              picked.append({"code": code, "handle": o["handle"],
                             "secret": o["token_secret"]})

          print("origins=" + json.dumps(picked))
          print("count=" + str(len(picked)))
          print("skipped=" + json.dumps(skipped))
          PY

      - name: Report the plan
        run: |
          echo "Posting for: ${{ steps.pick.outputs.origins }}" >> $GITHUB_STEP_SUMMARY
          echo "Skipped (already posted today): ${{ steps.pick.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY

  post:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      # Serial on purpose: every job commits its slides to main, and parallel
      # pushes to the same branch just race each other into rejections.
      max-parallel: 1
      fail-fast: false
      matrix:
        origin: ${{ fromJson(needs.plan.outputs.origins) }}

    name: post ${{ matrix.origin.code }} (@${{ matrix.origin.handle }})

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Confirm the account token exists
        env:
          IG_TOKEN: ${{ secrets[matrix.origin.secret] }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "::error::${{ matrix.origin.code }} is ig_enabled but repo secret ${{ matrix.origin.secret }} is empty."
            exit 1
          fi

      # Refresh THIS origin's site board first, so the post is built from fares
      # that are minutes old rather than from whenever the hourly cron last
      # managed to run. GitHub drops and delays scheduled runs (measured Jul 28:
      # gaps up to 11.4 hours), and the overnight gap means a dropped 6:23am
      # refresh would otherwise leave the 10:23pm board as the freshest thing on
      # disk. Doing it here removes the dependency on the cron entirely.
      #
      # continue-on-error on purpose: a Travelpayouts blip must not kill the
      # morning post. If this step fails, fetch_fares falls back to the
      # committed snapshot — and site_fares.py refuses that snapshot outright
      # unless it is from today and inside MAX_FARE_AGE_MIN, so the worst case
      # is a post built from the pipeline's own fetch, never from last night.
      - name: Refresh the site board for this origin (fares the post will use)
        continue-on-error: true
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          ORIGINS: ${{ matrix.origin.code }}
        run: python scripts/update_deals.py site/js/deals-data.js

      - name: Fetch and verify fares
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          ORIGIN: ${{ matrix.origin.code }}
          MAX_FARE_AGE_MIN: "180"
        run: python pipeline/fetch_fares.py

      - name: Render slides and stories
        env:
          ORIGIN: ${{ matrix.origin.code }}
        run: python pipeline/render_slides.py

      - name: Stage slides into the site
        if: github.event.inputs.dry_run != 'true'
        id: stage
        env:
          ORIGIN: ${{ matrix.origin.code }}
        run: |
          D=$(date +%F)
          # CLT keeps its original unprefixed path so live slide URLs never move.
          if [ "$ORIGIN" = "CLT" ]; then
            SRC=out;            DEST="site/daily/$D";        KEEP="site/daily/*/"
          else
            SRC="out/$ORIGIN";  DEST="site/daily/$ORIGIN/$D"; KEEP="site/daily/$ORIGIN/*/"
          fi
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
          mkdir -p "$DEST"
          cp "$SRC"/*.png "$DEST/"
          # Publish the EXACT board that is about to be posted, so the website
          # can show it. Someone who taps the bio link after seeing a fare on
          # Instagram was landing on the rotating board, which is chosen by a
          # different rule and frequently does not contain the fare they came
          # for. Same file, dated copy kept so an old post still converts.
          mkdir -p site/data site/daily
          if [ "$ORIGIN" = "CLT" ]; then DEALS=deals.json; else DEALS="deals-$ORIGIN.json"; fi
          cp "$DEALS" "site/data/post-$ORIGIN.json"
          cp "$DEALS" "$DEST/board.json"
          # keep only the last 14 days of slide folders for this origin
          ls -1d $KEEP 2>/dev/null | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}/$' \
            | sort | head -n -14 | xargs -r rm -rf
          git config user.name departs-bot
          git config user.email board@departsdaily.com
          git add -A
          # The 6-day no-repeat history is written by the fare fetch, before
          # anything has actually been posted. Committing it here would burn a
          # city for six days on a run that then failed to publish — which is
          # exactly what happened on 2026-07-27. It is committed after the
          # publish succeeds instead.
          git restore --staged state/history*.json 2>/dev/null || true
          git commit -m "IG slides $ORIGIN $D" || echo "no changes"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push slides after 5 attempts"; exit 1

      - name: Wait for Cloudflare Pages to actually serve the slides
        if: github.event.inputs.dry_run != 'true'
        id: wait
        run: |
          # THE 2026-07-30 OUTAGE LIVED HERE. This loop used to check only for
          # HTTP 200. Pages has no 404.html, so a path it has not deployed yet
          # returns 200 with index.html — the check passed on the first attempt,
          # in under a second, on every run. There was no wait at all, and Meta
          # got HTML and answered code 36001 "the URL returned an error page
          # instead of an image".
          #
          # Two changes: verify the CONTENT TYPE is an image, not just the
          # status; and probe on a throwaway query string, because /daily/* is
          # served max-age=86400 and a probe that gets HTML would otherwise
          # cache that HTML at the edge under the canonical URL for 24 hours —
          # poisoning the exact URL we are about to hand Instagram.
          WEB="$(echo '${{ steps.stage.outputs.dest }}' | sed 's|^site/||')"
          VER="${{ github.run_id }}-${{ github.run_attempt }}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          URL="https://departsdaily.com/$WEB/slide1_board.png"
          echo "waiting on $URL"
          # One good probe is not enough: our probe and Meta's fetcher hit
          # DIFFERENT edge POPs, and a deploy propagates per-POP. Aug 11 the
          # single-success check passed while Meta still got HTML (code 9004).
          # Now: 3 consecutive image responses, then a settle pause. The
          # publisher additionally retries fetch-race codes at Meta's layer.
          streak=0
          for i in $(seq 1 45); do
            probe=$(curl -s -o /dev/null -L \
              -w "%{http_code} %{content_type} %{size_download}" \
              "$URL?probe=$VER-$i")
            case "$probe" in
              "200 image/"*)
                streak=$((streak+1))
                echo "  attempt $i: image OK (streak $streak/3)"
                if [ "$streak" -ge 3 ]; then
                  echo "slides consistently served as an image; settling 30s for edge propagation"
                  sleep 30
                  exit 0
                fi
                sleep 15
                continue ;;
            esac
            streak=0
            echo "  attempt $i: $probe"
            sleep 10
          done
          echo "::error::slides never served as an image — aborting before a broken IG post"
          exit 1

      - name: Publish to Instagram
        if: github.event.inputs.dry_run != 'true'
        env:
          ORIGIN: ${{ matrix.origin.code }}
          IG_TOKEN: ${{ secrets[matrix.origin.secret] }}
          ASSET_VER: ${{ steps.wait.outputs.ver }}
        run: |
          export RAW_BASE="https://departsdaily.com/$(echo '${{ steps.stage.outputs.dest }}' | sed 's|^site/||')"
          echo "RAW_BASE=$RAW_BASE ASSET_VER=$ASSET_VER"
          python pipeline/publish_instagram.py

      # Only now is the city really spent.
      - name: Record what was posted
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name departs-bot
          git config user.email board@departsdaily.com
          git add -f state/history*.json
          git diff --cached --quiet && exit 0
          git commit -m "IG posted ${{ matrix.origin.code }}"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::posted, but could not record the no-repeat history"; exit 1

      # Instagram's own explanation of a refusal is the one thing worth keeping
      # from a failed run, and Actions logs age out. Commit it.
      # REHEARSAL OUTPUT. The whole point: see exactly what tomorrow's post would
      # look like, built from this morning's real fares, without posting it.
      # Download the artifact from the run page.
      - name: Upload the rehearsal slides
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-${{ matrix.origin.code }}
          path: |
            out/**/*.png
            out/**/slides.json
            out/scan-*.json
            deals.json
            deals-*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Say what the rehearsal produced
        if: github.event.inputs.dry_run == 'true'
        env:
          ORIGIN: ${{ matrix.origin.code }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          code = os.environ["ORIGIN"]
          path = "deals.json" if code == "CLT" else f"deals-{code}.json"
          b = json.load(open(path))
          print(f"## REHEARSAL — {code} (nothing was posted)\n")
          print(f"**{b.get('n_rows', len(b['deals']))} rows, "
                f"{b['n_deals']} of them real deals**\n")
          print("| slide | rows | real deals | shape |")
          print("|---|---|---|---|")
          for s in b.get("sections", []):
              n0, n1 = s["nights"]
              print(f"| {s['cover']} | {s['n']}/{s['rows_target']} | "
                    f"{s['n_deals']} | {n0}-{n1} nights |")
          PY

      - name: Keep the failure trail
        if: failure()
        run: |
          [ -f "out/ig-error-${{ matrix.origin.code }}.json" ] || exit 0
          git config user.name departs-bot
          git config user.email board@departsdaily.com
          git add -f "out/ig-error-${{ matrix.origin.code }}.json"
          git diff --cached --quiet && exit 0
          git commit -m "IG failure trail ${{ matrix.origin.code }}"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
