name: Morning Instagram post

# Fired at ~7:10 AM ET by a push to the 'ig-trigger' branch (precise timing),
# or manually from the Actions tab. No cron here on purpose: GitHub cron can
# run hours late, and a second same-day firing would double-post.
on:
  push:
    branches: [ig-trigger]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Fetch and verify fares
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python pipeline/fetch_fares.py

      - name: Render slides and stories
        run: |
          mkdir -p out
          python pipeline/render_slides.py

      - name: Stage slides into the site
        run: |
          D=$(date +%F)
          mkdir -p "site/daily/$D"
          cp out/*.png "site/daily/$D/"
          # keep only the last 14 days of slide folders
          ls -1d site/daily/*/ 2>/dev/null | sort | head -n -14 | xargs -r rm -rf
          git config user.name departs-bot
          git config user.email board@departsdaily.com
          git add -A
          git commit -m "IG slides $D" || echo "no changes"
          git push origin HEAD:main

      - name: Wait for Cloudflare Pages to serve the slides
        run: |
          # The push above triggers the Pages build. Poll until the cover
          # slide is actually live — Instagram fetches these URLs, so posting
          # before they resolve would publish a broken carousel.
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://departsdaily.com/daily/$(date +%F)/slide1_cover.png")
            [ "$code" = "200" ] && echo "slides live" && exit 0
            sleep 10
          done
          echo "slides never became reachable — aborting before a broken IG post"
          exit 1

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          export RAW_BASE="https://departsdaily.com/daily/$(date +%F)"
          python pipeline/publish_instagram.py
